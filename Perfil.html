<!DOCTYPE html>
<html>
	<head>
		<title>Perfil</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="styles.css">
		<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4535/4535090.png">
	</head>
	<body>
		<script>
		document.addEventListener("DOMContentLoaded", () => {
				const usuario = document.getElementById("usuario");
				const password = document.getElementById("password");

				function activarRojo(input) {
					input.style.borderColor = "red";
				}

				function validarContenido(input) {
					if (input.value.trim() !== "") {
						input.style.borderColor = "green";
					} else {
						input.style.borderColor = "red";
					}
				}

				usuario.addEventListener("focus", () => activarRojo(usuario));
				usuario.addEventListener("input", () => validarContenido(usuario));
				password.addEventListener("focus", () => activarRojo(password));
				password.addEventListener("input", () => validarContenido(password));
			});
		</script>
		<header class="principaproductos">
			<h1>TECNOLIGHT</h1>
		</header>
		<main class="cuerpologin">
			<div>
				<h2>Iniciar Sesión</h2>
				<form class="login">
					<label for="usuario">Usuario:</label>
					<input type="text" id="usuario" required>
					<label for="password">Contraseña:</label>
					<input type="password" id="password" required>
					<button type="submit">Entrar</button>
					<p id="error" style="color:red; display:none;">Usuario o contraseña incorrectos</p>
				</form>
			</div>
			<a href="index.html" class="binicio">Inicio</a>
		</main>
		<footer class="pieindex">
			<hr>
			<p><span>Creador: </span>Jorge García Casado</p>
			<p><span>Email: </span>jorgegarciac@iescastelar.com</p>
		</footer>
	</body>
</html>
